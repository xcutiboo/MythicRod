################################################################################
# TIPS FOR CUSTOMIZATION
################################################################################
#
# MIGRATION FROM LEGACY SETUP:
#
# If you are upgrading from an old version using messages.yml, follow these steps:
#
# 1. Copy your custom messages from this file
# 2. Paste them into the appropriate language file:
#    - English messages → messages_en.yml
#    - Japanese messages → messages_jp.yml
# 3. Delete or archive this (messages.yml) file
# 4. Update the language setting in config.yml if needed
#
# ADDING NEW LANGUAGES:
#
# 1. Create a new file: messages_XX.yml (where XX is your language code)
# 2. Copy all keys from messages_en.yml
# 3. Translate the values to your language
# 4. Missing keys will automatically fall back to English
#
# CUSTOMIZATION TIPS:
#
# Colors work with: &[0-9a-f][l/o/n/m/r]
#   Examples:
#   - "&6&lGOLDEN TEXT" = Bold Gold
#   - "&c&lERROR:" = Bold Red
#   - "&a✓ &fSUCCESS" = Green checkmark, white text
#   - "&8[Info] &7Details" = Gray brackets, light gray text
#
# Make messages stand out:
#   - Use bold (&l) for important words
#   - Use color changes for emphasis
#   - Keep messages brief and readable
#   - Use consistent formatting across similar messages
#
# Common patterns:
#   Errors/Warnings: &c (red)
#   Success/Good: &a (green)
#   Info/Neutral: &7 (light gray)
#   Important: &6 (gold) or &e (yellow)
#   Special/Rare: &b (cyan) or &d (pink)
#
################################################################################
