################################################################################
#                 MythicRod Messages Configuration (Legacy)                    #
#           This file is kept for backwards compatibility only.               #
#                                                                              #
#  DEPRECATED: New installations should use language-specific files:          #
#  - messages_en.yml for English                                             #
#  - messages_jp.yml for Japanese                                            #
#                                                                              #
#  MiniMessage Format: <color>, <bold>, <italic>, <reset>                     #
################################################################################

################################################################################
# GENERAL MESSAGES
################################################################################
prefix:
  default: '<gold><bold><</bold>MythicRod<bold>></bold></gold> <reset>'

general:
  no-permission: "<red>You don't have permission to use this command.</red>"
  reload-success: '<green>Configuration reloaded successfully!</green>'
  command-not-found: '<red>Unknown command. Use <yellow>/mythicrod help</yellow></red>'
  error: '<red>An error occurred while executing this command.</red>'

gui:
  players-only: '<red>Only players can use the GUI!</red>'
  language-changed: '<green>Language changed to <white>{language}</white>!</green>'

################################################################################
# FISHING MESSAGES
################################################################################
fishing:
  catch-rare: '<aqua><bold>✦ RARE CATCH!</bold></aqua> <white>You caught <yellow>{amount}× {item}</yellow>!</white>'
  catch-legendary: '<light_purple><bold>✦ LEGENDARY!</bold></light_purple> <white>You caught <yellow>{amount}× {item}</yellow>!</white>'
  catch-normal: '<green>✓ <green>You caught <yellow>{amount}× {item}</yellow>!</green>'
  stats-recorded: '<gray>+1 Fishing Stat Recorded</gray>'

################################################################################
# STATISTICS MESSAGES
################################################################################
stats:
  header: "<gold>----- <yellow>{player}'s Fishing Stats</yellow> <gold>-----"
  total-catches: '<yellow>Total Catches: <white>{total}</white></yellow>'
  rare-catches: '<yellow>Rare Catches: <white>{rare}</white></yellow>'
  legendary-catches: '<yellow>Legendary Catches: <white>{legendary}</white></yellow>'
  top-materials: '<gold>----- <yellow>Top Materials Caught</yellow> <gold>-----'
  material-count: '<yellow>{material}: <white>{count}</white></yellow>'
  player-not-found: '<red>Player <yellow>{player}</yellow> not found or has never fished yet.</red>'
  console-usage: '<red>You must specify a player name when using this command from console.</red>'
  disabled: '<red>Statistics tracking is disabled in the configuration.</red>'
  no-stats: '<red>No fishing statistics are available yet.</red>'
  top-header: '<gold>----- <yellow>Top {limit} Fishers</yellow> <gold>-----'
  top-entry: '<yellow>#{rank}: <white>{player}</white> <dark_gray>- <white>{catches} catches</white></yellow>'
  invalid-number: '<red>Invalid number: <white>{number}</white></red>'

################################################################################
# DROPS MESSAGES
################################################################################
drops:
  header: '<gold>----- <yellow>MythicRod Drop Categories</yellow> <gold>-----'
  category-entry: '<yellow>{category}: <white>{count} items</white></yellow>'
  usage: '<gray>Use <white>/mythicrod drops {category}</white> to view items in a category.</gray>'
  category-header: '<gold>----- <yellow>MythicRod Drops: {category}</yellow> <gold>-----'
  category-not-found: '<red>Drop category <yellow>{category}</yellow> not found.</red>'
  available-categories: '<gold>Available categories: <yellow>{categories}</yellow></gold>'
  drop-entry: '<yellow>{name}</yellow> <dark_gray>- <white>Chance: {chance}%, Amount: {amount}</white>'

################################################################################
# COMMAND MESSAGES
################################################################################
commands:
  reload:
    success: '<green>Configuration reloaded successfully!</green>'
    error: '<red>An error occurred while reloading the configuration.</red>'
  no-permission: "<red>You don't have permission to use this command.</red>"
  player-not-found: '<red>Player <yellow>{player}</yellow> not found or has never fished yet.</red>'
  help-header: '<gold>----- <yellow>MythicRod Commands</yellow> <gold>-----'
  help-gui: '<yellow>/mythicrod</yellow> <dark_gray>or</dark_gray> <yellow>/mythicrod gui</yellow> <dark_gray>- Open GUI menu</dark_gray>'
  help-reload: '<yellow>/mythicrod reload</yellow> <dark_gray>- Reload the plugin configuration</dark_gray>'
  help-stats: '<yellow>/mythicrod stats [player]</yellow> <dark_gray>- View fishing stats</dark_gray>'
  help-top: '<yellow>/mythicrod top [limit]</yellow> <dark_gray>- View top fishers</dark_gray>'
