################################################################################
# MythicRod English Messages (Base/Fallback Language)
# Modern MiniMessage Format - Paper 1.21.11+
################################################################################
# This is the primary/default language file for MythicRod.
# All missing keys in other languages will fall back to English translations.
#
# MiniMessage Format:
#   <red>, <green>, <blue>, <gold>, <yellow>, <aqua>, etc.
#   <bold>, <italic>, <underlined>, <strikethrough>
#   <reset>
#
################################################################################

prefix:
  default: '<gold><bold><</bold>MythicRod<bold>></bold></gold> <reset>'

general:
  no-permission: "<red>You don't have permission to do that.</red>"
  command-not-found: "<red>I don't recognize that command. Try <yellow>/mythicrod help</yellow></red>"
  error: '<red>Something went wrong. Check the server logs for details.</red>'

gui:
  players-only: '<red>The GUI only works in-game.</red>'
  language-changed: '<green>Language changed to <white>{language}</white>!</green>'
  permission-denied: "<red>You don't have permission to open the GUI.</red>"

fishing:
  catch-rare: '<aqua><bold>✦ RARE CATCH!</bold></aqua> <white>You reeled in <yellow>{amount}× {item}</yellow>!</white>'
  catch-legendary: '<light_purple><bold>✦ LEGENDARY!</bold></light_purple> <white>You discovered <yellow>{amount}× {item}</yellow>!</white>'
  catch-normal: '<green>✓ <green>Caught <yellow>{amount}× {item}</yellow>!</green>'
  stats-recorded: '<gray>+1 Fishing Stat Recorded</gray>'

stats:
  header: "<gold>━━━ <yellow>{player}'s Fishing Stats</yellow> <gold>━━━"
  total-catches: '<yellow>Total Catches: <white>{total}</white></yellow>'
  rare-catches: '<yellow>Rare Catches: <white>{rare}</white></yellow>'
  legendary-catches: '<yellow>Legendary Catches: <white>{legendary}</white></yellow>'
  top-materials: '<gold>━━━ <yellow>Top Materials Caught</yellow> <gold>━━━'
  material-count: '<yellow>{material}: <white>{count}</white></yellow>'
  permission-denied: "<red>You don't have permission to view stats.</red>"
  player-not-found: '<red>No player named <yellow>{player}</yellow> found.</red>'
  console-usage: '<red>Please specify a player name when using this from console.</red>'
  disabled: '<red>Statistics tracking is disabled.</red>'
  no-stats: "<red>There aren't any fishing stats yet.</red>"
  top-header: '<gold>━━━ <yellow>Top {limit} Fishers</yellow> <gold>━━━'
  top-entry: '<yellow>#{rank}: <white>{player}</white> <dark_gray>- <white>{catches} catches</white></yellow>'
  limit-invalid: '<red>Limit must be between <yellow>1</yellow> and <yellow>100</yellow></red>'

drops:
  header: '<gold>━━━ <yellow>MythicRod Drop Categories</yellow> <gold>━━━'
  category-entry: '<yellow>{category}: <white>{count} items</white></yellow>'
  usage: '<gray>Use <yellow>/mythicrod drops {category}</yellow> to see items.</gray>'
  category-header: '<gold>━━━ <yellow>MythicRod Drops: {category}</yellow> <gold>━━━'
  category-not-found: '<red>No drops found in category <yellow>{category}</yellow></red>'
  available-categories: '<gold>Available: <yellow>{categories}</yellow></gold>'
  drop-entry: '<yellow>{name}</yellow> <dark_gray>- <white>{chance}% chance, {amount}× per catch</white>'

commands:
  reload:
    start: '<yellow>Reloading configuration...</yellow>'
    success: '<green>Configuration reloaded successfully!</green>'
    failed: '<red>Failed to reload: <white>{error}</white></red>'
  permission-denied: '<red>You need the <white>{permission}</white> permission.</red>'
  gui-permission-denied: "<red>You don't have permission to open the GUI.</red>"
  player-not-found: '<red>No player named <yellow>{player}</yellow> found.</red>'
  console-only: '<red>This command requires you to be in-game.</red>'
  help-header: '<gold>━━━ <yellow>MythicRod Commands</yellow> <gold>━━━'
  help-gui: '<yellow>/mythicrod</yellow> <dark_gray>or</dark_gray> <yellow>/mythicrod gui</yellow> <dark_gray>- Open menu</dark_gray>'
  help-reload: '<yellow>/mythicrod reload</yellow> <dark_gray>- Reload configuration</dark_gray>'
  help-stats: '<yellow>/mythicrod stats [player]</yellow> <dark_gray>- View stats</dark_gray>'
  help-top: '<yellow>/mythicrod top [limit]</yellow> <dark_gray>- Top fishers</dark_gray>'
  help-drops: '<yellow>/mythicrod drops [category]</yellow> <dark_gray>- View drops</dark_gray>'
  help-help: '<yellow>/mythicrod help</yellow> <dark_gray>- Show this message</dark_gray>'

