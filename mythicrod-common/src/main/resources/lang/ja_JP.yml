#==============================================================================
# MythicRod - 日本語言語ファイル
# この言語ファイルは日本語のユーザー向けです。
# 不足しているキーは英語（en_US）にフォールバックされます。
#
# フォーマットバージョン: 2.0
# 言語コード: ja_JP
# 言語名: 日本語
# 翻訳者: MythicRod Team
#
# カラーコード:
#   <black>-<blue>, <green>-<white> = 色
#   <bold> = 太字 | <italic> = 斜体 | <underlined> = 下線 | <strikethrough> = 取り消し線 | <reset> = リセット
#
# プレースホルダー:
#   波括弧を使用: {player}, {amount}, {item}, {count}など
#   プレースホルダー名は翻訳しないでください
#
# 翻訳者の方へ:
#   - 同じトーン(友好的、プロフェッショナル、役立つ)を維持してください
#   - カラーコードはそのままにしてください
#   - プレースホルダーの位置をテストし、自然な文法を確保してください
#   - 改行とフォーマットを保持してください
#   - 完全な翻訳ガイドラインについては lang/README.md を参照してください
#==============================================================================

#==============================================================================
# 一般的なメッセージ
#==============================================================================
prefix:
  default: '<gold><bold><MythicRod> <reset>'

general:
  no-permission: '<red>その操作を行う権限がありません。'
  command-not-found: '<red>そのコマンドは認識できません。<yellow>/mythicrod help<red>を試してください。'
  error: '<red>エラーが発生しました。詳細はコンソールを確認してください。'
  player-only: '<red>このコマンドはゲーム内でのみ使用できます。'
  console-only: '<red>このコマンドはコンソールから使用できません。プレイヤーを指定してください。'
  player-not-found: '<red><yellow>{player}<red>という名前のプレイヤーが見つかりませんでした。'
  invalid-number: '<red>無効な数値です: <white>{input}'

#==============================================================================
# コマンドメッセージ
#==============================================================================
commands:
  help:
    header: '<gold>━━━ <yellow>MythicRod コマンド一覧 <gold>━━━'
    gui: '<yellow>/mythicrod <gray>または <yellow>/mythicrod gui <gray>- メニューを開く'
    reload: '<yellow>/mythicrod reload <gray>- 設定を再読み込み'
    stats: '<yellow>/mythicrod stats [プレイヤー] <gray>- 釣り統計を表示'
    top: '<yellow>/mythicrod top [件数] <gray>- ランキングを表示'
    drops: '<yellow>/mythicrod drops [カテゴリ] <gray>- ドロップ一覧を表示'
    help: '<yellow>/mythicrod help <gray>- このヘルプを表示'

  reload:
    start: '<yellow>設定を再読み込み中...'
    success: '<green>設定の再読み込みが完了しました！'
    failed: '<red>設定の再読み込みに失敗しました: <white>{error}'
    permission-denied: '<red>この操作には <white>mythicrod.reload<red> 権限が必要です。'

  gui:
    permission-denied: '<red>メニューを開く権限がありません。'

  stats:
    permission-denied: '<red>統計を表示する権限がありません。'
    disabled: '<red>統計トラッキングは現在無効です。'
    no-data: '<red>まだ釣りの統計が記録されていません。'
    limit-invalid: '<red>件数は <yellow>1<red> から <yellow>100<red> の間で指定してください。'

  drops:
    permission-denied: '<red>ドロップを表示する権限がありません。'
    category-not-found: '<red>カテゴリ <yellow>{category}<red> にドロップが見つかりませんでした。'
    available-categories: '<gold>利用可能なカテゴリ: <yellow>{categories}'

