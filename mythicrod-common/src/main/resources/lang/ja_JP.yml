#==============================================================================
# MythicRod - 日本語言語ファイル
# この言語ファイルは日本語のユーザー向けです。
# 不足しているキーは英語（en_US）にフォールバックされます。
#
# フォーマットバージョン: 2.0
# 言語コード: ja_JP
# 言語名: 日本語
# 翻訳者: MythicRod Team
#
# カラーコード:
#   &0-&9, &a-&f = 色
#   &l = 太字 | &o = 斜体 | &n = 下線 | &m = 取り消し線 | &r = リセット
#
# プレースホルダー:
#   波括弧を使用: {player}, {amount}, {item}, {count}など
#   プレースホルダー名は翻訳しないでください
#
# 翻訳者の方へ:
#   - 同じトーン(友好的、プロフェッショナル、役立つ)を維持してください
#   - カラーコードはそのままにしてください
#   - プレースホルダーの位置をテストし、自然な文法を確保してください
#   - 改行とフォーマットを保持してください
#   - 完全な翻訳ガイドラインについては lang/README.md を参照してください
#==============================================================================

#==============================================================================
# 一般的なメッセージ
#==============================================================================
prefix:
  default: '&6&l<MythicRod> &r'

general:
  no-permission: '&cその操作を行う権限がありません。'
  command-not-found: '&cそのコマンドは認識できません。&e/mythicrod help&cを試してください。'
  error: '&cエラーが発生しました。詳細はコンソールを確認してください。'
  player-only: '&cこのコマンドはゲーム内でのみ使用できます。'
  console-only: '&cこのコマンドはコンソールから使用できません。プレイヤーを指定してください。'
  player-not-found: '&c&e{player}&cという名前のプレイヤーが見つかりませんでした。'
  invalid-number: '&c無効な数値です: &f{input}'

#==============================================================================
# コマンドメッセージ
#==============================================================================
commands:
  help:
    header: '&6━━━ &eMythicRod コマンド一覧 &6━━━'
    gui: '&e/mythicrod &7または &e/mythicrod gui &7- メニューを開く'
    reload: '&e/mythicrod reload &7- 設定を再読み込み'
    stats: '&e/mythicrod stats [プレイヤー] &7- 釣り統計を表示'
    top: '&e/mythicrod top [件数] &7- ランキングを表示'
    drops: '&e/mythicrod drops [カテゴリ] &7- ドロップ一覧を表示'
    help: '&e/mythicrod help &7- このヘルプを表示'

  reload:
    start: '&e設定を再読み込み中...'
    success: '&a設定の再読み込みが完了しました！'
    failed: '&c設定の再読み込みに失敗しました: &f{error}'
    permission-denied: '&cこの操作には &fmythicrod.reload&c 権限が必要です。'

  gui:
    permission-denied: '&cメニューを開く権限がありません。'

  stats:
    permission-denied: '&c統計を表示する権限がありません。'
    disabled: '&c統計トラッキングは現在無効です。'
    no-data: '&cまだ釣りの統計が記録されていません。'
    limit-invalid: '&c件数は &e1&c から &e100&c の間で指定してください。'

  drops:
    permission-denied: '&cドロップを表示する権限がありません。'
    category-not-found: '&cカテゴリ &e{category}&c にドロップが見つかりませんでした。'
    available-categories: '&6利用可能なカテゴリ: &e{categories}'

