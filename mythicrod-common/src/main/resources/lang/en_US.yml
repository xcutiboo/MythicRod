  #==============================================================================
# MythicRod - English (United States) Language File
# This is the authoritative base language for MythicRod.
# All other languages will fall back to these translations if keys are missing.
#
# Format Version: 2.0
# Language Code: en_US
# Language Name: English
# Translators: MythicRod Team
#
# Color Codes:
#   &0-&9, &a-&f = Colors
#   &l = Bold | &o = Italic | &n = Underline | &m = Strikethrough | &r = Reset
#
# Placeholders:
#   Use curly braces: {player}, {amount}, {item}, {count}, etc.
#   Do NOT translate placeholder names - only translate surrounding text
#
# For Translators:
#   - Maintain the same tone: friendly, professional, and helpful
#   - Keep color codes in place (they control text appearance)
#   - Test placeholder positions to ensure natural grammar
#   - Preserve line breaks and formatting
#   - See lang/README.md for full translation guidelines
#==============================================================================

#==============================================================================
# GENERAL MESSAGES
#==============================================================================
prefix:
  default: '&6&l<MythicRod> &r'

general:
  no-permission: "&cYou don't have permission to do that."
  command-not-found: "&cI don't recognize that command. Try &e/mythicrod help&c."
  error: '&cSomething went wrong. Check the console for details.'
  player-only: '&cThis command can only be used in-game.'
  console-only: '&cThis command cannot be used from the console. Please specify a player.'
  player-not-found: '&cNo player named &e{player}&c could be found.'
  invalid-number: '&cThat's not a valid number: &f{input}'

#==============================================================================
# COMMAND MESSAGES
#==============================================================================
commands:
  help:
    header: '&6━━━ &eMythicRod Commands &6━━━'
    gui: '&e/mythicrod &7or &e/mythicrod gui &7- Open the menu'
    reload: '&e/mythicrod reload &7- Reload configuration'
    stats: '&e/mythicrod stats [player] &7- View fishing statistics'
    top: '&e/mythicrod top [limit] &7- View top fishers leaderboard'
    drops: '&e/mythicrod drops [category] &7- View available drops'
    help: '&e/mythicrod help &7- Show this help message'

  reload:
    start: '&eReloading configuration...'
    success: '&aConfiguration reloaded successfully!'
    failed: '&cFailed to reload configuration: &f{error}'
    permission-denied: "&cYou need the &fmythicrod.reload&c permission to do that."

  gui:
    permission-denied: "&cYou don't have permission to open the menu."

  stats:
    permission-denied: "&cYou don't have permission to view statistics."
    disabled: '&cStatistics tracking is currently disabled.'
    no-data: "&cThere aren't any fishing statistics recorded yet."
    limit-invalid: '&cThe limit must be between &e1&c and &e100&c.'

  drops:
    permission-denied: "&cYou don't have permission to view drops."
    category-not-found: '&cNo drops found in category &e{category}&c.'
    available-categories: '&6Available categories: &e{categories}'

