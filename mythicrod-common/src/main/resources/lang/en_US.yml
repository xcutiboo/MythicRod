  #==============================================================================
# MythicRod - English (United States) Language File
# This is the authoritative base language for MythicRod.
# All other languages will fall back to these translations if keys are missing.
#
# Format Version: 2.0
# Language Code: en_US
# Language Name: English
# Translators: MythicRod Team
#
# Color Codes (MiniMessage format):
#   <black> <dark_blue> <dark_green> <dark_aqua> <dark_red> <dark_purple> <gold> <gray>
#   <dark_gray> <blue> <green> <aqua> <red> <light_purple> <yellow> <white>
#   <bold> <italic> <underlined> <strikethrough> <obfuscated> <reset>
#
# Placeholders:
#   Use curly braces: {player}, {amount}, {item}, {count}, etc.
#   Do NOT translate placeholder names - only translate surrounding text
#
# For Translators:
#   - Maintain the same tone: friendly, professional, and helpful
#   - Keep color codes in place (they control text appearance)
#   - Test placeholder positions to ensure natural grammar
#   - Preserve line breaks and formatting
#   - See lang/README.md for full translation guidelines
#==============================================================================

#==============================================================================
# GENERAL MESSAGES
#==============================================================================
prefix:
  default: '<gold><bold>[MythicRod]</bold></gold> '

general:
  no-permission: "<red>You don't have permission to do that."
  command-not-found: "<red>I don't recognize that command. Try <yellow>/mythicrod help</red>."
  error: '<red>Something went wrong. Check the console for details.</red>'
  player-only: '<red>This command can only be used in-game.</red>'
  console-only: '<red>This command cannot be used from the console. Please specify a player.</red>'
  player-not-found: '<red>No player named <yellow>{player}</red> could be found.</red>'
  invalid-number: '<red>That is not a valid number: <white>{input}</red>'

#==============================================================================
# COMMAND MESSAGES
#==============================================================================
commands:
  help:
    header: '<gold>━━━ <yellow>MythicRod Commands <gold>━━━</gold></yellow></gold>'
    gui: '<yellow>/mythicrod <gray>or <yellow>/mythicrod gui <gray>- Open the menu</gray></yellow></gray></yellow>'
    reload: '<yellow>/mythicrod reload <gray>- Reload configuration</gray></yellow>'
    stats: '<yellow>/mythicrod stats [player] <gray>- View fishing statistics</gray></yellow>'
    top: '<yellow>/mythicrod top [limit] <gray>- View top fishers leaderboard</gray></yellow>'
    drops: '<yellow>/mythicrod drops [category] <gray>- View available drops</gray></yellow>'
    help: '<yellow>/mythicrod help <gray>- Show this help message</gray></yellow>'

  reload:
    start: '<yellow>Reloading configuration...'</yellow>
    success: '<green>Configuration reloaded successfully!'</green>
    failed: '<red>Failed to reload configuration: <white>{error}</white></red>'
    permission-denied: "<red>You need the <white>mythicrod.reload</white> permission to do that.</red>"

  gui:
    permission-denied: "<red>You don't have permission to open the menu.</red>"

  stats:
    permission-denied: "<red>You don't have permission to view statistics.</red>"
    disabled: '<red>Statistics tracking is currently disabled.</red>'
    no-data: "<red>There aren't any fishing statistics recorded yet.</red>"
    limit-invalid: '<red>The limit must be between <yellow>1</yellow> and <yellow>100</yellow>.</red>'

  drops:
    permission-denied: "<red>You don't have permission to view drops.</red>"
    category-not-found: '<red>No drops found in category <yellow>{category}</yellow>.</red>'
    available-categories: '<gold>Available categories: <yellow>{categories}</yellow></gold>'

