################################################################################
# BIOME-SPECIFIC DROPS
################################################################################
# These drops are ONLY available when fishing in the specified BIOME.
# Enable 'enable-biome-specific-drops: true' in config.yml to use this feature.
#
# HOW IT WORKS:
#   1. Player fishes in a specific biome (e.g., Ocean)
#   2. If biome-specific drops are enabled
#   3. Drops from that biome's list are used instead of global
#   4. Gives appropriate drops to that biome
#
# WHY USE IT:
#   - More immersive (ocean=ocean items, desert=desert items)
#   - Encourages exploration (players fish in different biomes)
#   - More control over drop distribution
#   - Thematic gameplay
#
# STRUCTURE:
#   biome-name:
#     - 'MATERIAL,WEIGHT,AMOUNT'
#
# BIOME LIST:
#   Water biomes: ocean, river, beach, deep_ocean, deep_cold_ocean
#   Forest biomes: forest, dark_forest, taiga, old_growth_taiga, birch_forest
#   Hot biomes: desert, badlands, savanna, nether, end
#   Other: jungle, plains, mushroom_fields, swamp, snowy_plains, windswept_hills
#
# TIPS:
# - Use thematic items for each biome
# - Keep weights balanced like global drops
# - Can have 3-8+ items per biome
# - Items should match biome aesthetic
#
biome-drops:
  # ────────────────────────────────────────────────────────────────────────
  # OCEAN BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Water, dolphins, fish, seaweed
  # Thematic items: Prismarine, hearts of the sea, nautilus shells, fish
  #
  ocean:
    - 'PRISMARINE_CRYSTALS,20,1'
    - 'PRISMARINE_SHARD,30,1'
    - 'HEART_OF_THE_SEA,5,1'
    - 'NAUTILUS_SHELL,15,1'
    - 'TROPICAL_FISH,25,1'
    - 'SEAGRASS,30,3'
    - 'KELP,25,5'

  # ────────────────────────────────────────────────────────────────────────
  # DESERT BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Sand, cactus, very few water sources
  # Thematic items: Gold, sand, dead bushes, pottery
  #
  desert:
    - 'GOLD_NUGGET,30,3'
    - 'DEAD_BUSH,40,1'
    - 'CACTUS,30,1'
    - 'RABBIT_HIDE,20,2'
    - 'SAND,50,5'
    - 'TERRACOTTA,15,1'

  # ────────────────────────────────────────────────────────────────────────
  # JUNGLE BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Dense vegetation, cocoa, bamboo, exotic animals
  # Thematic items: Cocoa, bamboo, tropical fish, eggs
  #
  jungle:
    - 'COCOA_BEANS,30,2'
    - 'BAMBOO,40,3'
    - 'TROPICAL_FISH,25,1'
    - 'PARROT_SPAWN_EGG,3,1'
    - 'MELON,20,1'
    - 'VINES,35,2'

  # ────────────────────────────────────────────────────────────────────────
  # MUSHROOM FIELDS BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Mushrooms, mycelium, peaceful creatures
  # Thematic items: Mushrooms, mycelium, rare resources
  #
  mushroom_fields:
    - 'RED_MUSHROOM,30,3'
    - 'BROWN_MUSHROOM,30,3'
    - 'MYCELIUM,15,1'
    - 'MOOSHROOM_SPAWN_EGG,2,1'
    - 'MUSHROOM_STEM,20,2'

  # ────────────────────────────────────────────────────────────────────────
  # FOREST BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Trees, animals, nature
  # Thematic items: Wood, apples, nature items
  #
  forest:
    - 'OAK_LOG,40,2'
    - 'APPLE,30,1'
    - 'SWEET_BERRIES,25,2'
    - 'BEE_SPAWN_EGG,5,1'
    - 'OAK_SAPLING,20,3'

  # ────────────────────────────────────────────────────────────────────────
  # SWAMP BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Water, lily pads, slimes, murky waters
  # Thematic items: Lilies, slime, swamp resources
  #
  swamp:
    - 'LILY_PAD,35,2'
    - 'SLIME_BALL,25,1'
    - 'MUD,30,3'
    - 'MANGROVE_LOG,20,1'
    - 'SLIME_SPAWN_EGG,3,1'
################################################################################
# ADVANCED CONFIGURATION GUIDE
################################################################################
#
# ADDING NEW DROPS:
#   Step 1: Choose a category (global, rare, legendary, or biome)
#   Step 2: Add the item with proper format
#   Step 3: Run /mythicrod reload to apply
#   Step 4: Test by fishing to verify it works
#
#   Example - Adding a diamond drop to global:
#     global:
#       - 'DIAMOND,10,1'   ← Add this line
#
# CREATING A CUSTOM LEGENDARY:
#   Step 1: Choose a material
#   Step 2: Pick a cool name (use underscores)
#   Step 3: Add colors to the name and lore
#   Step 4: Add enchantments (1-10 levels)
#   Step 5: Add item-flags to hide boring info
#   Step 6: Set glowing: true to make it shine
#
#   Example:
#     my_custom_item:
#       material: DIAMOND_SWORD
#       chance: 2
#       amount: 1
#       name: '&c&lMy Custom Sword'
#       lore:
#         - '&7This is my custom item'
#         - '&7It was made with love'
#       enchantments:
#         sharpness: 5
#         unbreaking: 3
#       glowing: true
#
# BALANCING DROP RATES:
#   Problem: Item drops too often / not enough
#   Solution: Adjust the WEIGHT value
#
#   Item drops too often?
#     - Lower its weight (from 30 to 10)
#
#   Item doesn't drop enough?
#     - Raise its weight (from 5 to 20)
#
#   Item needs to drop much less?
#     - Reduce weight significantly (from 20 to 1)
#
# PERMISSION NODES:
#   Global drops: No permission needed
#   Rare drops: Requires mythicrod.drops.rare
#   Legendary drops: Requires mythicrod.drops.legendary (or custom per item)
#   Biome drops: Requires enable-biome-specific-drops in config.yml
#
# MATERIAL NAMES:
#   Use Minecraft item names (all caps, underscores for spaces)
#   See full list at: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
#
#   Common examples:
#   - Ore: COAL, IRON_ORE, GOLD_ORE, DIAMOND_ORE, EMERALD_ORE
#   - Ingot: IRON_INGOT, GOLD_INGOT, COPPER_INGOT, NETHERITE_INGOT
#   - Gem: DIAMOND, EMERALD, QUARTZ, AMETHYST_SHARD, LAPIS_LAZULI
#   - Block: OAK_LOG, STONE, DIRT, GRASS_BLOCK, OBSIDIAN
#   - Tool: DIAMOND_PICKAXE, IRON_AXE, NETHERITE_SWORD
#
# ENCHANTED BOOKS - SPECIAL CONFIGURATION:
#   Enchanted books use ENCHANTED_BOOK material with stored enchantments.
#   The plugin automatically handles the correct book metadata.
#
#   Example enchanted book configurations:
#
#   # Single enchantment book
#   fortune_book:
#     material: ENCHANTED_BOOK
#     chance: 3
#     amount: 1
#     name: '&e&lBook of Fortune III'
#     enchantments:
#       fortune: 3
#     glowing: true
#
#   # Multi-enchantment book
#   protection_book:
#     material: ENCHANTED_BOOK
#     chance: 2
#     amount: 1
#     name: '&9&lBook of Ultimate Protection'
#     lore:
#       - '&7A tome of defensive magic'
#     enchantments:
#       protection: 4
#       unbreaking: 3
#       thorns: 2
#     glowing: true
#
#   Common enchantments for books:
#     - mending, unbreaking
#     - sharpness, smite, bane_of_arthropods
#     - protection, fire_protection, blast_protection, projectile_protection
#     - efficiency, fortune, silk_touch
#     - looting, luck_of_the_sea, lure
#     - power, punch, flame, infinity
#     - respiration, aqua_affinity, depth_strider, frost_walker
#     - feather_falling, thorns, knockback, sweeping_edge
#
#   Note: The plugin automatically uses EnchantmentStorageMeta for books,
#         so they will work exactly like vanilla enchanted books!
#
# TROUBLESHOOTING:
#   "Drop doesn't appear in game"
#     → Check material name spelling (case-sensitive)
#     → Run /mythicrod reload
#     → Check player has correct permission
#     → Verify format is correct (MATERIAL,WEIGHT,AMOUNT)
#
#   "Item appears too often"
#     → Lower the WEIGHT value for that item
#     → Raise WEIGHT for other items
#     → Example: Change "DIAMOND,20,1" to "DIAMOND,5,1"
#
#   "Legendary item doesn't work"
#     → Check YAML indentation (use 2 spaces, no tabs)
#     → Verify material name exists
#     → Check enchantment names are valid
#     → Reload with /mythicrod reload
#
#   "Enchanted book doesn't have enchantment"
#     → Make sure you're using ENCHANTED_BOOK material (not BOOK)
#     → Verify enchantment names are spelled correctly (lowercase)
#     → Check enchantment level is valid (usually 1-5, some go higher)
#     → Run /mythicrod reload after changes
#
#   "Biome drops don't work"
#     → Check enable-biome-specific-drops is true in config.yml
#     → Check biome name is correct (all lowercase)
#     → Verify you're fishing IN that biome
#     → Run /mythicrod reload
#
