################################################################################
#                                                                              #
#                    MythicRod Drops Configuration File                        #
#              Define custom fishing drops and loot tables here                #
#                                                                              #
#  QUICK START:                                                               #
#    1. Add items to the 'drops' section below                               #
#    2. Use simple format: "MATERIAL,WEIGHT,AMOUNT"                          #
#    3. Reload with: /mythicrod reload                                       #
#                                                                              #
#  DETAILED GUIDE:                                                            #
#    See section headers below for complete explanations of each category     #
#                                                                              #
################################################################################

################################################################################
# GLOBAL DROP SYSTEM OVERVIEW
################################################################################
#
# HOW DROPS WORK:
#   When a player catches a fish, the plugin:
#   1. Checks which category to use (global, rare, biome-specific, legendary)
#   2. Randomly selects a drop based on WEIGHT values
#   3. Gives the player the item with specified AMOUNT
#   4. Plays sound/particle effects (if enabled)
#   5. Records statistics (if enabled)
#
# DROP CATEGORIES:
#   ├─ GLOBAL DROPS      → Available to ALL players, ALWAYS
#   ├─ RARE DROPS        → Restricted (need mythicrod.drops.rare permission)
#   ├─ LEGENDARY DROPS   → Special items with custom names/enchantments/permissions
#   └─ BIOME-SPECIFIC    → Different drops per biome (ocean, desert, jungle, etc)
#
# WEIGHT SYSTEM:
#   Higher weight = More likely to drop
#   Weight is RELATIVE, not absolute
#
#   Example with 4 items:
#   - Item A: weight 5   → 5/40 = 12.5% chance
#   - Item B: weight 10  → 10/40 = 25% chance
#   - Item C: weight 15  → 15/40 = 37.5% chance
#   - Item D: weight 10  → 10/40 = 25% chance
#   Total weight = 40
#
#   To get specific percentages, use:
#   - 1% drop: weight 1 (with total weight of 100)
#   - 5% drop: weight 5 (with total weight of 100)
#   - 10% drop: weight 10 (with total weight of 100)
#
# AMOUNT:
#   How many of the item the player receives (default 1)
#   Can be any number 1-64
#
################################################################################

################################################################################
# MAIN DROP CATEGORIES
################################################################################

drops:
  # ============================================================================
  # ✓ GLOBAL DROPS - Available to all players
  # ============================================================================
  # These drops are given to EVERY player who catches a fish.
  # Format: "MATERIAL,WEIGHT,AMOUNT"
  #   - MATERIAL: Minecraft item name (see Material Names section)
  #   - WEIGHT: Relative probability (higher = more common)
  #   - AMOUNT: Number of items to give (1-64)
  #
  # TIPS:
  # - Use low weights for valuable items (DIAMOND=5)
  # - Use high weights for common items (COBBLESTONE=100)
  # - Keep total weight reasonable (aim for 100-200 total)
  # - Always have at least 3-4 items to make fishing interesting
  #
  # COMMON ITEMS FOR GLOBAL:
  #   - Ores: COAL, IRON_INGOT, GOLD_NUGGET, COPPER_INGOT, etc.
  #   - Crystals: QUARTZ, AMETHYST_SHARD, PRISMARINE_CRYSTAL
  #   - Fish: FISH, SALMON, TROPICAL_FISH, PUFFERFISH
  #   - Special: OBSIDIAN, GLOWSTONE_DUST, MAGMA_CREAM
  #
  global:
    - 'DIAMOND,5,1'
    - 'IRON_INGOT,30,1'
    - 'GOLD_INGOT,20,1'
    - 'EMERALD,15,1'
    - 'NETHERITE_INGOT,1,1'
    - 'AMETHYST_SHARD,25,2'
    - 'QUARTZ,35,3'
    - 'LAPIS_LAZULI,20,2'

  # ============================================================================
  # ⚠ RARE DROPS - Restricted access with permission
  # ============================================================================
  # These drops are LESS COMMON and require player permission.
  # Required permission: mythicrod.drops.rare
  #
  # PERMISSION SETUP:
  #   For different permission plugins:
  #   ├─ LuckPerms: /lp user <player> permission set mythicrod.drops.rare
  #   ├─ PermEx: /pex user <player> add mythicrod.drops.rare
  #   └─ GroupManager: /manuadd <player> mythicrod.drops.rare
  #
  # WHO GETS THESE:
  #   - VIP players
  #   - Premium supporters
  #   - Whitelist members
  #   - Special event participants
  #
  # TIPS:
  # - Use rare materials (ANCIENT_DEBRIS, NETHER_STAR, etc.)
  # - Use very low weights (1-3)
  # - These complement global drops, not replace them
  # - Can include blocks and valuables
  #
  # COMMON RARE ITEMS:
  #   - Nether: ANCIENT_DEBRIS, NETHERITE_SCRAP, NETHERITE_BLOCK
  #   - Expensive: DIAMOND_BLOCK, EMERALD_BLOCK, GOLD_BLOCK
  #   - Special: NETHER_STAR, DRAGON_EGG, BEACON
  #
  rare:
    - 'ANCIENT_DEBRIS,3,1'
    - 'NETHERITE_SCRAP,5,1'
    - 'DIAMOND_BLOCK,1,1'
    - 'NETHER_STAR,1,1'
    - 'DRAGON_EGG,1,1'
    - 'GOLDEN_APPLE,2,1'

  # ============================================================================
  # ★ LEGENDARY DROPS - Custom items with full configuration
  # ============================================================================
  # These are SPECIAL ITEMS with advanced customization:
  #   - Custom names with color codes
  #   - Custom lore (descriptions)
  #   - Enchantments with custom levels
  #   - Visual effects (glowing)
  #   - Optional permissions
  #   - Custom flags
  #
  # STRUCTURE:
  #   item-name:                    # Unique identifier (no spaces)
  #     material: MATERIAL_NAME     # Required: Bukkit material name
  #     chance: 1                   # Required: Weight/probability
  #     amount: 1                   # Optional: Items to give (default 1)
  #     name: '&b&lCustom Name'     # Optional: Display name with colors
  #     lore:                       # Optional: Description lines
  #       - '&7Line 1'
  #       - '&7Line 2'
  #     enchantments:               # Optional: Enchantment:level pairs
  #       sharpness: 5
  #       unbreaking: 3
  #     item-flags:                 # Optional: Hide attributes/enchants
  #       - HIDE_ATTRIBUTES
  #       - HIDE_ENCHANTS
  #     glowing: true               # Optional: Add enchant glow effect
  #     permission: mythicrod...    # Optional: Required permission
  #
  # NAMING TIPS:
  # - Use unique identifiers: excalibur, crown_of_neptune, ancient_artifact
  # - Use _ for spaces, keep lowercase
  # - Make names memorable and thematic
  #
  # COLOR CODES:
  # &0=Black  &1=Blue      &2=Green        &3=Cyan
  # &4=Red    &5=Purple    &6=Gold         &7=Gray
  # &8=DGray  &9=LBlue     &a=LGreen       &b=Aqua
  # &c=Red    &d=LPurple   &e=Yellow       &f=White
  # &l=Bold   &o=Italic    &n=Underline    &m=Strikethrough &r=Reset
  #
  # ENCHANTMENT LEVELS:
  # - Normal items: 1-5
  # - OP items: Can go to 10+ (looks impressive on legendaries)
  # - Common enchants: sharpness, protection, unbreaking, efficiency, etc.
  #
  # ITEM FLAGS (hide info from players):
  # - HIDE_ATTRIBUTES: Hide damage/armor info
  # - HIDE_ENCHANTS: Hide enchantment names
  # - HIDE_UNBREAKABLE: Hide durability bar
  # - HIDE_CAN_PLACE: Hide block placement info
  # - HIDE_CAN_DESTROY: Hide block breaking info
  # - HIDE_OTHER_STUFF: Hide miscellaneous info
  # - HIDE_POTION_EFFECTS: Hide potion effects
  #
  # GLOWING EFFECT:
  # - Makes item glow (like enchanted items)
  # - Very visible when held in inventory
  # - Creates visual distinction for legendaries
  #
  # PERMISSION:
  # - Optional: Only players with this permission can get the item
  # - Example: mythicrod.drops.legendary.excalibur
  # - If omitted: Anyone can receive the item
  #
  legendary:
    # Example 1: Epic Sword
    excalibur:
      material: NETHERITE_SWORD
      chance: 1
      amount: 1
      name: '&b&lExcalibur'
      lore:
        - '&7A legendary sword pulled from the depths'
        - '&7of the ancient lake.'
        - ''
        - '&bLegendary Fishing Artifact'
      enchantments:
        sharpness: 10
        sweeping_edge: 3
        unbreaking: 5
        knockback: 2
      item-flags:
        - HIDE_ATTRIBUTES
        - HIDE_ENCHANTS
      glowing: true
      permission: mythicrod.drops.legendary

    # Example 2: Epic Helmet
    neptunes_crown:
      material: GOLDEN_HELMET
      chance: 2
      amount: 1
      name: "&b&lNeptune's Crown"
      lore:
        - '&7The crown of the sea god himself.'
        - '&7Grants the wearer water breathing.'
        - ''
        - '&bLegendary Fishing Artifact'
      enchantments:
        respiration: 10
        protection: 4
        unbreaking: 5
        aqua_affinity: 1
      item-flags:
        - HIDE_ATTRIBUTES
        - HIDE_ENCHANTS
      glowing: true
      permission: mythicrod.drops.legendary

    # Example 3: Special Item
    ancient_artifact:
      material: AMETHYST_BLOCK
      chance: 1
      amount: 1
      name: '&5&lAncient Artifact'
      lore:
        - '&7An ancient artifact from a lost civilization.'
        - '&7Its purpose is unknown, but it radiates magic.'
        - ''
        - '&5Mystical Fishing Artifact'
      enchantments:
        unbreaking: 5
      glowing: true

    # Example 4: Enchanted Book (Mending)
    mending_book:
      material: ENCHANTED_BOOK
      chance: 1
      amount: 1
      name: '&b&lBook of Mending'
      lore:
        - '&7A legendary tome containing'
        - '&7the Mending enchantment.'
        - ''
        - '&bLegendary Enchanted Book'
      enchantments:
        mending: 1
      glowing: true
      permission: mythicrod.drops.legendary

    # Example 5: Enchanted Book (Sharpness V)
    sharpness_book:
      material: ENCHANTED_BOOK
      chance: 2
      amount: 1
      name: '&c&lBook of Sharpness'
      lore:
        - '&7A powerful book of combat.'
        - ''
        - '&cRare Enchanted Book'
      enchantments:
        sharpness: 5
      glowing: true

################################################################################
# BIOME-SPECIFIC DROPS
################################################################################
# These drops are ONLY available when fishing in the specified BIOME.
# Enable 'enable-biome-specific-drops: true' in config.yml to use this feature.
#
# HOW IT WORKS:
#   1. Player fishes in a specific biome (e.g., Ocean)
#   2. If biome-specific drops are enabled
#   3. Drops from that biome's list are used instead of global
#   4. Gives appropriate drops to that biome
#
# WHY USE IT:
#   - More immersive (ocean=ocean items, desert=desert items)
#   - Encourages exploration (players fish in different biomes)
#   - More control over drop distribution
#   - Thematic gameplay
#
# STRUCTURE:
#   biome-name:
#     - 'MATERIAL,WEIGHT,AMOUNT'
#
# BIOME LIST:
#   Water biomes: ocean, river, beach, deep_ocean, deep_cold_ocean
#   Forest biomes: forest, dark_forest, taiga, old_growth_taiga, birch_forest
#   Hot biomes: desert, badlands, savanna, nether, end
#   Other: jungle, plains, mushroom_fields, swamp, snowy_plains, windswept_hills
#
# TIPS:
# - Use thematic items for each biome
# - Keep weights balanced like global drops
# - Can have 3-8+ items per biome
# - Items should match biome aesthetic
#
biome-drops:
  # ────────────────────────────────────────────────────────────────────────
  # OCEAN BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Water, dolphins, fish, seaweed
  # Thematic items: Prismarine, hearts of the sea, nautilus shells, fish
  #
  ocean:
    - 'PRISMARINE_CRYSTALS,20,1'
    - 'PRISMARINE_SHARD,30,1'
    - 'HEART_OF_THE_SEA,5,1'
    - 'NAUTILUS_SHELL,15,1'
    - 'TROPICAL_FISH,25,1'
    - 'SEAGRASS,30,3'
    - 'KELP,25,5'

  # ────────────────────────────────────────────────────────────────────────
  # DESERT BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Sand, cactus, very few water sources
  # Thematic items: Gold, sand, dead bushes, pottery
  #
  desert:
    - 'GOLD_NUGGET,30,3'
    - 'DEAD_BUSH,40,1'
    - 'CACTUS,30,1'
    - 'RABBIT_HIDE,20,2'
    - 'SAND,50,5'
    - 'TERRACOTTA,15,1'

  # ────────────────────────────────────────────────────────────────────────
  # JUNGLE BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Dense vegetation, cocoa, bamboo, exotic animals
  # Thematic items: Cocoa, bamboo, tropical fish, eggs
  #
  jungle:
    - 'COCOA_BEANS,30,2'
    - 'BAMBOO,40,3'
    - 'TROPICAL_FISH,25,1'
    - 'PARROT_SPAWN_EGG,3,1'
    - 'MELON,20,1'
    - 'VINES,35,2'

  # ────────────────────────────────────────────────────────────────────────
  # MUSHROOM FIELDS BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Mushrooms, mycelium, peaceful creatures
  # Thematic items: Mushrooms, mycelium, rare resources
  #
  mushroom_fields:
    - 'RED_MUSHROOM,30,3'
    - 'BROWN_MUSHROOM,30,3'
    - 'MYCELIUM,15,1'
    - 'MOOSHROOM_SPAWN_EGG,2,1'
    - 'MUSHROOM_STEM,20,2'

  # ────────────────────────────────────────────────────────────────────────
  # FOREST BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Trees, animals, nature
  # Thematic items: Wood, apples, nature items
  #
  forest:
    - 'OAK_LOG,40,2'
    - 'APPLE,30,1'
    - 'SWEET_BERRIES,25,2'
    - 'BEE_SPAWN_EGG,5,1'
    - 'OAK_SAPLING,20,3'

  # ────────────────────────────────────────────────────────────────────────
  # SWAMP BIOME
  # ────────────────────────────────────────────────────────────────────────
  # Features: Water, lily pads, slimes, murky waters
  # Thematic items: Lilies, slime, swamp resources
  #
  swamp:
    - 'LILY_PAD,35,2'
    - 'SLIME_BALL,25,1'
    - 'MUD,30,3'
    - 'MANGROVE_LOG,20,1'
    - 'SLIME_SPAWN_EGG,3,1'
