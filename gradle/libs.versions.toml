[versions]
# Minecraft Platform
paper = "1.21.4-R0.1-SNAPSHOT"
spigot = "1.21.4-R0.1-SNAPSHOT"

# Gradle Plugins
paperweight = "1.7.7"
shadow = "8.3.5"
run-paper = "2.3.1"

# Dependencies
nexo = "0.1.0-dev.130"
guice = "7.0.0"
configurate = "4.1.2"
adventure-platform = "4.3.4"
adventure-minimessage = "4.17.0"
adventure-legacy = "4.17.0"
hikaricp = "5.1.0"
lettuce = "6.3.2.RELEASE"
folia-scheduler = "v1.0.2"
bstats = "3.1.0"

# Build
java = "21"

[libraries]
# Paper Platform
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }

# Integrations
nexo = { module = "com.nexomc:nexo", version.ref = "nexo" }

# Dependency Injection
guice = { module = "com.google.inject:guice", version.ref = "guice" }

# Configuration
configurate-hocon = { module = "org.spongepowered:configurate-hocon", version.ref = "configurate" }

# Database & Caching
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }

# Scheduler
folia-scheduler = { module = "com.github.CJCrafter:FoliaScheduler", version.ref = "folia-scheduler" }

# Metrics
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
bstats-base = { module = "org.bstats:bstats-base", version.ref = "bstats" }

# Adventure (for Spigot)
adventure-platform-bukkit = { module = "net.kyori:adventure-platform-bukkit", version.ref = "adventure-platform" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure-minimessage" }
adventure-text-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure-legacy" }

[plugins]
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }

[bundles]
adventure = ["adventure-platform-bukkit", "adventure-text-minimessage", "adventure-text-serializer-legacy"]
