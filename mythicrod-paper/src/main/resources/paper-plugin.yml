################################################################################
#                                                                              #
#                    MythicRod Paper Plugin Configuration                      #
#           Paper-specific plugin manifest and permissions hierarchy           #
#                                                                              #
#  This file is used by Paper servers and defines hierarchical permissions.  #
#  For basic Bukkit compatibility, see: plugin.yml                           #
#  For game configuration, see: config.yml                                   #
#                                                                              #
################################################################################

################################################################################
# PLUGIN INFORMATION
################################################################################
name: MythicRod
version: '${version}'
main: io.xcutiboo.mythicrod.MythicRod
api-version: '1.21'
description: Advanced fishing plugin with customizable drops, biome-specific loot, and player statistics
website: https://github.com/xcutiboo/mythicrod
authors:
  - xcutiboo

# Plugin load order: POSTWORLD ensures world data is available
load: POSTWORLD

# Folia support (async/threaded server): Enabled for modern scheduling
folia-supported: true

################################################################################
# SOFT DEPENDENCIES (Optional - plugin works without these)
################################################################################
# These are optional integrations that enhance functionality but are not required
softdepend:
  - Nexo              # Custom item support via reflection
  - PlaceholderAPI    # Statistics placeholders for scoreboards/holograms
  - Oraxen            # Alternative custom item support

################################################################################
# PERMISSIONS STRUCTURE
################################################################################
# Paper allows hierarchical permissions with parent-child relationships
# Format:
#   parent-permission:
#     description: What this permission allows
#     default: true/false/op/not op
#     children:
#       child-permission: true  (inherits from parent)
#
# When a player has "mythicrod.*", they automatically get all children

permissions:
  # ============================================================================
  # ROOT PERMISSION - Grants all MythicRod permissions
  # ============================================================================
  mythicrod.*:
    description: All MythicRod permissions
    default: op
    children:
      mythicrod.command: true
      mythicrod.gui: true
      mythicrod.admin.*: true
      mythicrod.stats.*: true
      mythicrod.drops.*: true

  # ============================================================================
  # BASIC COMMAND & GUI PERMISSIONS
  # ============================================================================
  mythicrod.command:
    description: Access to the main /mythicrod command
    default: true

  mythicrod.gui:
    description: Access to the MythicRod GUI menu
    default: true

  # ============================================================================
  # ADMINISTRATIVE PERMISSIONS
  # ============================================================================
  mythicrod.admin.*:
    description: All administrative permissions
    default: op
    children:
      mythicrod.admin.reload: true
      mythicrod.admin.give: true
      mythicrod.admin.debug: true
      mythicrod.admin.config: true

  mythicrod.admin.config:
    description: Allows editing of custom drops and plugin settings via GUI
    default: op

  mythicrod.admin.reload:
    description: Reload plugin configuration without restart
    default: op

  mythicrod.admin.give:
    description: Give MythicRods to players
    default: op

  mythicrod.admin.debug:
    description: Access debug information
    default: op

  # ============================================================================
  # STATISTICS PERMISSIONS
  # ============================================================================
  mythicrod.stats.*:
    description: All statistics permissions
    default: true
    children:
      mythicrod.stats.view: true
      mythicrod.stats.view.others: true
      mythicrod.stats.leaderboard: true

  mythicrod.stats.view:
    description: View your own fishing statistics
    default: true

  mythicrod.stats.view.others:
    description: View other players' fishing statistics
    default: op

  mythicrod.stats.leaderboard:
    description: View the fishing leaderboard (top fishers)
    default: true

  # ============================================================================
  # DROP CATEGORY PERMISSIONS
  # ============================================================================
  mythicrod.drops.*:
    description: All drop permissions
    default: op
    children:
      mythicrod.drops.view: true
      mythicrod.drops.global: true
      mythicrod.drops.rare: true
      mythicrod.drops.legendary: true

  mythicrod.drops.view:
    description: View available drops and categories
    default: true

  mythicrod.drops.global:
    description: Receive drops from the global category
    default: true

  mythicrod.drops.rare:
    description: Receive drops from the rare category (restricted)
    default: op

  mythicrod.drops.legendary:
    description: Receive drops from the legendary category (restricted)
    default: op

  mythicrod.rod.advanced:
    description: Use advanced rod tier
    default: op

  mythicrod.rod.legendary:
    description: Use legendary rod tier
    default: op
################################################################################
# PERMISSION SETUP GUIDE
################################################################################
#
# HIERARCHY OVERVIEW:
#   mythicrod.*
#   ├── mythicrod.command
#   ├── mythicrod.admin.*
#   │   └── mythicrod.admin.reload
#   ├── mythicrod.stats.*
#   │   ├── mythicrod.stats.view
#   │   ├── mythicrod.stats.view.others
#   │   └── mythicrod.stats.leaderboard
#   └── mythicrod.drops.*
#       ├── mythicrod.drops.view
#       ├── mythicrod.drops.global
#       ├── mythicrod.drops.rare
#       └── mythicrod.drops.legendary
#
# COMMON SETUPS:
#
#   Standard Player:
#   - mythicrod.command        (Can use /mythicrod)
#   - mythicrod.stats.view     (Can view own stats)
#   - mythicrod.drops.view     (Can see drop info)
#   - mythicrod.drops.global   (Can catch global drops)
#
#   Premium Player:
#   - All above, plus:
#   - mythicrod.drops.rare     (Can catch rare drops)
#
#   Operator/Admin:
#   - mythicrod.*              (ALL permissions)
#
# PERMISSION NODES IN PERMISSION MANAGERS:
#   LuckPerms: /lp user {player} permission set mythicrod.drops.rare true
#   PermissionsEx: /pex user {player} add mythicrod.drops.rare
#   GroupManager: /manaddp {player} mythicrod.drops.rare
#
################################################################################