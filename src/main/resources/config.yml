# MythicRod Configuration
# Format: MATERIAL,CHANCE,AMOUNT
# MATERIAL must be a valid Minecraft material name
# CHANCE is relative to other items (higher number = more common)
# AMOUNT is how many of the item will be given

drops:
  - "DIAMOND,5,1"
  - "IRON_INGOT,30,1"
  - "GOLD_INGOT,20,1"
  - "EMERALD,15,1"
  - "NETHERITE_INGOT,1,1"

# The prefix for plugin messages
prefix: "§6§l<MythicRod> "
