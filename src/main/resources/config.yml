# MythicRod Configuration
# A fully customizable fishing plugin that replaces vanilla drops

# Visual settings
prefix: "&6&l<MythicRod> &r"
use-sounds: true
use-particles: true

# Core features
track-statistics: true
enable-biome-specific-drops: true
use-permissions: false

# The following settings are for backwards compatibility
# For advanced drop configuration, see drops.yml
drops:
  - "DIAMOND,5,1"
  - "IRON_INGOT,30,1"
  - "GOLD_INGOT,20,1"
  - "EMERALD,15,1"
  - "NETHERITE_INGOT,1,1"
