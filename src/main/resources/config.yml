################################################################################
#                       MythicRod Configuration File                           #
#                                                                              #
#  Customize MythicRod behavior and features for your server.                 #
#  Docs: /mythicrod (in-game GUI) or CONFIG_GUIDE.md                          #
################################################################################

################################################################################
# MESSAGING
################################################################################
# Prefix used in all plugin messages and chat output
# Supports Minecraft color codes (&1-&f, &l for bold, &o for italic, etc.)
prefix: '&6&l<MythicRod> &r'

# Language selection for all player-facing text
# Supported: en (English, default), jp (Japanese)
# Fallback: If a key is missing in the selected language, English is used
language: 'en'

################################################################################
# VISUAL SETTINGS - How the plugin presents itself to players
################################################################################

# Sound Effects: Play sounds when catching fish and interacting with menus
# - When enabled: Plays sounds on successful catches and UI interactions
# - When disabled: Silent fishing and menu interactions
# Values: true/false | Default: true
use-sounds: true

# Particle Effects: Display particles for special events
# - When enabled: Shows particles on rare/legendary catches
# - When disabled: No particle effects
# Values: true/false | Default: true
use-particles: true

################################################################################
# CORE FEATURES - Main plugin functionality
################################################################################

# Statistics Tracking: Record player fishing statistics
# - When enabled: Tracks catches, stats, and leaderboards
# - When disabled: No stat recording (saves memory)
# Values: true/false | Default: true
track-statistics: true

# Biome-Specific Drops: Use different drops per biome
# - When enabled: Different biomes have different drop tables
# - When disabled: Only global category drops are available
# Values: true/false | Default: true
enable-biome-specific-drops: true

# Permission System: Require permissions for certain drops
# - When enabled: Players need permissions to catch restricted drops
# - When disabled: All players can catch all drops
# Values: true/false | Default: false
use-permissions: false

################################################################################
# PERFORMANCE SETTINGS - Tune for your server
################################################################################

# Statistics Save Interval (in seconds)
# How often to automatically save player statistics to disk
# Lower values = more frequent saves (safer, more disk I/O)
# Higher values = less frequent saves (lighter on disk, risk of data loss)
#
# Recommendations:
#   Small servers (< 10 players): 300-600 seconds (5-10 minutes)
#   Medium servers (10-100 players): 600-1200 seconds (10-20 minutes)
#   Large servers (> 100 players): 1200+ seconds (20+ minutes)
#
# Minimum: 60 seconds | Default: 600 seconds (10 minutes)
stats-save-interval: 600

# Hook Cleanup Interval (in seconds)
# How often to remove old/unused fishing hooks from memory
# This prevents memory leaks from abandoned hooks
# Lower values = more frequent cleanup (slightly more CPU)
# Higher values = less frequent cleanup (potential memory bloat)
#
# Recommendations:
#   Small servers: 180-300 seconds (3-5 minutes)
#   Medium servers: 300-600 seconds (5-10 minutes)
#   Large servers: 600+ seconds (10+ minutes)
#
# Minimum: 60 seconds | Default: 300 seconds (5 minutes)
hook-cleanup-interval: 300

################################################################################
# DEBUG MODE - Troubleshooting and diagnostics
################################################################################
# Enable detailed logging for troubleshooting
# When enabled, logs detailed information about:
#   - Drop selection reasoning for each catch
#   - Biome detection results
#   - Permission evaluation details
#   - Fishing event processing steps
#   - Eligible drop counts and filtering
#
# WARNING: Can generate LOTS of console output!
# Only enable this when troubleshooting issues.
# Remember to disable it after troubleshooting!
#
# Values: true/false | Default: false
debug-mode: false

################################################################################
# BACKWARDS COMPATIBILITY
################################################################################
# The following settings are for backwards compatibility with old configs.
# For advanced drop configuration, please see: drops.yml
#
# This section is kept for migration purposes. Consider migrating to drops.yml
# if you have existing custom drop configurations.
drops:
  - 'DIAMOND,5,1'
  - 'IRON_INGOT,30,1'
  - 'GOLD_INGOT,20,1'
  - 'EMERALD,15,1'
  - 'NETHERITE_INGOT,1,1'
################################################################################
# CONFIGURATION COMPLETE
################################################################################
# Use /mythicrod in-game to access the configuration GUI for easy management
# Changes made through the GUI take effect immediately!
# Use /mythicrod reload to reload from disk without restarting the server
