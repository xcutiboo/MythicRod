<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512"
     role="img"
     aria-labelledby="title"
     shape-rendering="geometricPrecision">

  <title id="title">MythicRod</title>

  <defs>
    <filter id="iconShadow"
            filterUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="512"
            height="512"
            color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity=".22"/>
    </filter>

    <mask id="maskHandleReelHole" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
      <circle cx="203" cy="291" r="24" fill="#000000"/>
    </mask>
  </defs>

  <g id="layer-mythicrod-artwork"
     filter="url(#iconShadow)"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

    <g id="group-lower-hollow-handle" mask="url(#maskHandleReelHole)">
      <rect id="lower-handle-edge"
            x="93" y="304" width="150" height="44" rx="22"
            transform="rotate(-45 168 326)"
            stroke="#835516" stroke-width="26"/>
      <rect id="lower-handle-gold"
            x="93" y="304" width="150" height="44" rx="22"
            transform="rotate(-45 168 326)"
            stroke="#DCA13A" stroke-width="18"/>
    </g>

    <g id="group-connected-string-curves">
      <path id="string-curve-1-edge"
            d="M238 257 C254 290 290 286 300 195"
            stroke="#835516" stroke-width="26"/>
      <path id="string-curve-1-gold"
            d="M238 257 C254 290 290 286 300 195"
            stroke="#DCA13A" stroke-width="18"/>
      <path id="string-curve-2-edge"
            d="M300 195 C316 223 353 218 367 128"
            stroke="#835516" stroke-width="26"/>
      <path id="string-curve-2-gold"
            d="M300 195 C316 223 353 218 367 128"
            stroke="#DCA13A" stroke-width="18"/>
    </g>

    <g id="group-rod-line-hook">
      <path id="rod-line-hook-edge"
            d="M231 264
               L405 90
               L405 247
               C405 264 418 270 421 288
               C425 311 409 331 388 333
               C368 334 355 321 355 302
               C355 291 362 283 374 278"
            stroke="#835516" stroke-width="26"/>
      <path id="rod-line-hook-gold"
            d="M231 264
               L405 90
               L405 247
               C405 264 418 270 421 288
               C425 311 409 331 388 333
               C368 334 355 321 355 302
               C355 291 362 283 374 278"
            stroke="#DCA13A" stroke-width="18"/>
    </g>

    <g id="group-reel-overlay">
      <circle id="reel-ring-edge"
              cx="203" cy="291" r="36"
              stroke="#835516" stroke-width="26"/>
      <circle id="reel-ring-gold"
              cx="203" cy="291" r="36"
              stroke="#DCA13A" stroke-width="18"/>
    </g>

    <g id="group-upper-handle-connector">
      <path id="upper-handle-connector-edge"
            d="M124 271 L154 241 L203 291"
            stroke="#835516" stroke-width="26"/>
      <path id="upper-handle-connector-gold"
            d="M124 271 L154 241 L203 291"
            stroke="#DCA13A" stroke-width="18"/>
    </g>
  </g>
</svg>
