name: Publish to Hangar

on:
  # Publish only on a real GitHub release. Bare tag pushes do not fire this.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_replace:
        description: Delete the existing version first, then upload fresh.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Clear gradle build cache
        run: |
          rm -rf mythicrod-api/build mythicrod-common/build mythicrod-paper/build
          ./gradlew --stop || true

      - name: Build shadow jar (fresh)
        if: env.HANGAR_API_TOKEN != ''
        run: ./gradlew :mythicrod-paper:build --rerun-tasks --stacktrace --no-daemon

      - name: Replace existing Hangar version
        if: env.HANGAR_API_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.force_replace
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [[ -z "$version" || "$version" == "$VERSION" ]]; then
            version=$(./gradlew -q :mythicrod-paper:properties | awk -F': *' '/^version:/{print $2; exit}')
          fi
          slug="MythicRod"
          jwt=$(curl -fsS -X POST \
            "https://hangar.papermc.io/api/v1/authenticate?apiKey=${HANGAR_API_TOKEN}" \
            | jq -r .token)
          if [[ -z "$jwt" || "$jwt" == "null" ]]; then
            echo "Hangar authenticate did not return a JWT; skipping delete."
            exit 0
          fi
          curl -sS -X DELETE -H "Authorization: $jwt" \
            "https://hangar.papermc.io/api/v1/projects/${slug}/versions/${version}" \
            -o /dev/null -w 'Hangar DELETE HTTP %{http_code}\n' \
            || echo "Hangar version delete returned non-zero (may already be absent)"

      - name: Upload version to Hangar
        if: env.HANGAR_API_TOKEN != ''
        id: publish_jar
        continue-on-error: true
        run: ./gradlew :mythicrod-paper:publishPluginPublicationToHangar --stacktrace --no-daemon

      - name: Sync resource page to Hangar
        if: env.HANGAR_API_TOKEN != ''
        run: ./gradlew :mythicrod-paper:syncPluginPublicationMainResourcePagePageToHangar --stacktrace --no-daemon

      - name: Note jar upload outcome
        if: env.HANGAR_API_TOKEN != '' && steps.publish_jar.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "The version upload step finished with a non-zero exit. If the failure was 'duplicateNameAndPlatform', the version already exists on Hangar from an earlier build with the same tag; the resource-page sync above is the only useful work for this tag and the job is treated as a soft pass. Any other failure must be triaged from the previous step's log."

      - name: Verify Hangar jar sha256 matches GitHub release asset
        if: env.HANGAR_API_TOKEN != '' && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          # Wait for Hangar CDN to settle after the upload.
          sleep 30
          mkdir -p .verify
          gh release download "$REF_NAME" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "MythicRod-Paper-${version}.jar" \
            --dir .verify
          curl -fsSL -o .verify/hangar.jar \
            "https://hangarcdn.papermc.io/plugins/xcutiboo/MythicRod/versions/${version}/PAPER/MythicRod-Paper-${version}.jar?cb=$(date +%s)"
          release_sha=$(sha256sum ".verify/MythicRod-Paper-${version}.jar" | awk '{print $1}')
          hangar_sha=$(sha256sum .verify/hangar.jar | awk '{print $1}')
          echo "release sha256: $release_sha"
          echo "hangar  sha256: $hangar_sha"
          if [[ "$release_sha" != "$hangar_sha" ]]; then
            echo "::error::Hangar jar diverged from GitHub release. Gradle cache likely served stale classes. Delete the version on Hangar (web UI) and re-upload the GitHub release asset manually."
            exit 1
          fi
          echo "Hangar jar matches GitHub release."

      - name: Skip without Hangar token
        if: env.HANGAR_API_TOKEN == ''
        run: echo "HANGAR_API_TOKEN is not configured; skipping Hangar publish."
