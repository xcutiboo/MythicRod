name: Publish to Hangar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Publish Paper jar
        if: env.HANGAR_API_TOKEN != ''
        run: ./gradlew :mythicrod-paper:build :mythicrod-paper:publishPluginPublicationToHangar :mythicrod-paper:syncPluginPublicationMainResourcePagePageToHangar --stacktrace --no-daemon

      - name: Skip without Hangar token
        if: env.HANGAR_API_TOKEN == ''
        run: echo "HANGAR_API_TOKEN is not configured; skipping Hangar publish."
