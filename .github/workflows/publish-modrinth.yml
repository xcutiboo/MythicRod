name: Publish to Modrinth

on:
  # Publish only on a real GitHub release. Bare tag pushes do not fire this.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_replace:
        description: Delete the existing Modrinth version first, then upload fresh.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Clear gradle build cache
        run: |
          rm -rf mythicrod-api/build mythicrod-common/build mythicrod-paper/build
          ./gradlew --stop || true

      - name: Build shadow jar (fresh)
        run: ./gradlew :mythicrod-paper:shadowJar --rerun-tasks --stacktrace --no-daemon

      - name: Resolve release metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=""
          if [[ "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version=$(./gradlew -q :mythicrod-paper:properties | awk -F': *' '/^version:/{print $2; exit}')
          fi
          if [[ -z "$version" ]]; then
            echo "Could not resolve a version; aborting." >&2
            exit 1
          fi
          jar=$(ls mythicrod-paper/build/libs/MythicRod-Paper-*.jar | grep -v -- '-dev' | head -1)
          channel="release"
          case "$version" in
            *-rc*|*-beta*|*-alpha*|*-snapshot*) channel="beta" ;;
          esac
          # Skip the jar upload on plain workflow_dispatch (without force_replace),
          # so manual runs only refresh the project body. Release and tag pushes
          # always upload; workflow_dispatch with force_replace=true also uploads.
          jar_publish="true"
          case "$EVENT_NAME" in
            push|release) jar_publish="true" ;;
            workflow_dispatch)
              if [[ "${{ inputs.force_replace }}" == "true" ]]; then
                jar_publish="true"
              else
                jar_publish="false"
              fi
              ;;
            *) jar_publish="false" ;;
          esac
          {
            echo "version=$version"
            echo "jar=$jar"
            echo "channel=$channel"
            echo "jar_publish=$jar_publish"
          } >> "$GITHUB_OUTPUT"

      - name: Check Modrinth for an existing version
        if: env.MODRINTH_TOKEN != '' && steps.meta.outputs.jar_publish == 'true'
        id: dedupe
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          force_replace="${{ inputs.force_replace }}"
          if [[ "$force_replace" == "true" ]]; then
            echo "force_replace requested; will replace any existing version."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(curl -fsSL \
            -H "User-Agent: xcutiboo/MythicRod CI" \
            "https://api.modrinth.com/v2/project/mythicrod/version/${VERSION}" \
            -o /dev/null -w "%{http_code}" || true)
          if [[ "$existing" == "200" ]]; then
            echo "Modrinth already has version $VERSION; skipping upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace existing Modrinth version
        if: env.MODRINTH_TOKEN != '' && github.event_name == 'workflow_dispatch' && inputs.force_replace
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ver_id=$(curl -fsS -H "Authorization: ${MODRINTH_TOKEN}" \
            "https://api.modrinth.com/v2/project/mythicrod/version/${VERSION}" \
            | jq -r .id || true)
          if [[ -n "$ver_id" && "$ver_id" != "null" ]]; then
            curl -fsS -X DELETE -H "Authorization: ${MODRINTH_TOKEN}" \
              "https://api.modrinth.com/v2/version/${ver_id}"
            echo "Deleted Modrinth version $ver_id"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Modrinth
        if: |
          env.MODRINTH_TOKEN != ''
          && steps.meta.outputs.jar_publish == 'true'
          && steps.dedupe.outputs.skip == 'false'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: mythicrod
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.channel }}
          files: ${{ steps.meta.outputs.jar }}
          name: MythicRod ${{ steps.meta.outputs.version }}
          loaders: |
            paper
            folia
          game-versions: |
            26.1.2
          changelog-file: CHANGELOG.md
          dependencies: |
            Nexo(optional){modrinth:nexo}
          fail-mode: warn

      - name: Sync project body to Modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          base = "https://raw.githubusercontent.com/xcutiboo/MythicRod/master"
          with open("README.md", encoding="utf-8") as fh:
              body = fh.read()
          body = re.sub(r'(!\[[^\]]*\]\(|src=")(?:\./)?(assets/[^)"\s]+)',
                        lambda m: f'{m.group(1)}{base}/{m.group(2)}', body)
          body = re.sub(r'\[([^\]]+)\]\((?:\./)?docs/([^)\s]+)\)',
                        lambda m: f'[{m.group(1)}](https://github.com/xcutiboo/MythicRod/blob/master/docs/{m.group(2)})',
                        body)
          body = re.sub(r'\[([^\]]+)\]\(LICENSE\)',
                        lambda m: f'[{m.group(1)}](https://github.com/xcutiboo/MythicRod/blob/master/LICENSE)', body)
          body = re.sub(r'\[([^\]]+)\]\(CHANGELOG\.md\)',
                        lambda m: f'[{m.group(1)}](https://github.com/xcutiboo/MythicRod/blob/master/CHANGELOG.md)', body)
          payload = json.dumps({
              "body": body,
              "source_url": "https://github.com/xcutiboo/MythicRod",
              "issues_url": "https://github.com/xcutiboo/MythicRod/issues",
              "wiki_url": "https://xcutiboo.github.io/MythicRod/",
              "discord_url": "https://discord.gg/MDwtUgxX9U",
              "donation_urls": [
                  {"id": "ko-fi", "platform": "Ko-fi", "url": "https://ko-fi.com/xcutiboo"}
              ],
          }).encode()
          req = urllib.request.Request(
              "https://api.modrinth.com/v2/project/mythicrod",
              data=payload, method="PATCH",
              headers={
                  "Authorization": os.environ["MODRINTH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "xcutiboo/MythicRod (CI body sync)",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Modrinth body sync HTTP {resp.status}")
          except urllib.error.HTTPError as exc:
              print(f"Modrinth body sync failed: HTTP {exc.code}", exc.read().decode("utf-8", "replace"))
              sys.exit(0)
          PY

      - name: Verify Modrinth jar sha256 matches GitHub release asset
        if: env.MODRINTH_TOKEN != '' && github.event_name == 'release' && steps.meta.outputs.jar_publish == 'true' && steps.dedupe.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Modrinth needs a moment for the CDN to point at the new file.
          sleep 30
          mkdir -p .verify
          gh release download "$REF_NAME" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "MythicRod-Paper-${VERSION}.jar" \
            --dir .verify
          cdn=$(curl -fsSL -H "User-Agent: xcutiboo/MythicRod CI" \
            "https://api.modrinth.com/v2/project/mythicrod/version/${VERSION}" \
            | jq -r '.files[0].url')
          if [[ -z "$cdn" || "$cdn" == "null" ]]; then
            echo "Could not resolve Modrinth CDN url; skipping verify."
            exit 0
          fi
          curl -fsSL -o .verify/modrinth.jar "$cdn"
          release_sha=$(sha256sum ".verify/MythicRod-Paper-${VERSION}.jar" | awk '{print $1}')
          modrinth_sha=$(sha256sum .verify/modrinth.jar | awk '{print $1}')
          echo "release  sha256: $release_sha"
          echo "modrinth sha256: $modrinth_sha"
          if [[ "$release_sha" != "$modrinth_sha" ]]; then
            echo "::error::Modrinth jar diverged from GitHub release. Likely stale gradle cache. Force-replace via workflow_dispatch with force_replace=true."
            exit 1
          fi
          echo "Modrinth jar matches GitHub release."

      - name: Skip without Modrinth token
        if: env.MODRINTH_TOKEN == ''
        run: echo "MODRINTH_TOKEN is not configured; skipping Modrinth publish."
