name: Publish to Modrinth

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build shadow jar
        run: ./gradlew :mythicrod-paper:shadowJar --stacktrace --no-daemon

      - name: Resolve release metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if [[ -z "$version" ]]; then
            version=$(./gradlew -q :mythicrod-paper:properties | awk -F': *' '/^version:/{print $2; exit}')
          fi
          jar=$(ls mythicrod-paper/build/libs/MythicRod-Paper-*.jar | grep -v -- '-dev' | head -1)
          channel="release"
          case "$version" in
            *-rc*|*-beta*|*-alpha*|*-snapshot*) channel="beta" ;;
          esac
          {
            echo "version=$version"
            echo "jar=$jar"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: mythicrod
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.channel }}
          files: ${{ steps.meta.outputs.jar }}
          name: MythicRod ${{ steps.meta.outputs.version }}
          loaders: |
            paper
            folia
          game-versions: |
            1.21.11
          changelog-file: CHANGELOG.md
          dependencies: |
            Nexo(optional){modrinth:nexo}
          fail-mode: warn

      - name: Skip without Modrinth token
        if: env.MODRINTH_TOKEN == ''
        run: echo "MODRINTH_TOKEN is not configured; skipping Modrinth publish."
