name: Publish to Modrinth

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build shadow jar
        run: ./gradlew :mythicrod-paper:shadowJar --stacktrace --no-daemon

      - name: Resolve release metadata
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=""
          if [[ "$REF_NAME" == v* ]]; then
            version="${REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version=$(./gradlew -q :mythicrod-paper:properties | awk -F': *' '/^version:/{print $2; exit}')
          fi
          if [[ -z "$version" ]]; then
            echo "Could not resolve a version; aborting." >&2
            exit 1
          fi
          jar=$(ls mythicrod-paper/build/libs/MythicRod-Paper-*.jar | grep -v -- '-dev' | head -1)
          channel="release"
          case "$version" in
            *-rc*|*-beta*|*-alpha*|*-snapshot*) channel="beta" ;;
          esac
          # Manual dispatches only sync the project body; skip version upload to avoid duplicates.
          jar_publish="true"
          if [[ "$EVENT_NAME" != "push" ]]; then
            jar_publish="false"
          fi
          {
            echo "version=$version"
            echo "jar=$jar"
            echo "channel=$channel"
            echo "jar_publish=$jar_publish"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && steps.meta.outputs.jar_publish == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: mythicrod
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.channel }}
          files: ${{ steps.meta.outputs.jar }}
          name: MythicRod ${{ steps.meta.outputs.version }}
          loaders: |
            paper
            folia
          game-versions: |
            26.1.2
          changelog-file: CHANGELOG.md
          dependencies: |
            Nexo(optional){modrinth:nexo}
          fail-mode: warn

      - name: Sync project body to Modrinth
        if: env.MODRINTH_TOKEN != ''
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          base = "https://raw.githubusercontent.com/xcutiboo/MythicRod/master"
          with open("README.md", encoding="utf-8") as fh:
              body = fh.read()
          body = re.sub(r'(!\[[^\]]*\]\(|src=")(?:\./)?(assets/[^)"\s]+)',
                        lambda m: f'{m.group(1)}{base}/{m.group(2)}', body)
          body = re.sub(r'\[([^\]]+)\]\((?:\./)?docs/([^)\s]+)\)',
                        lambda m: f'[{m.group(1)}](https://github.com/xcutiboo/MythicRod/blob/master/docs/{m.group(2)})',
                        body)
          body = re.sub(r'\[([^\]]+)\]\(LICENSE\)',
                        lambda m: f'[{m.group(1)}](https://github.com/xcutiboo/MythicRod/blob/master/LICENSE)', body)
          body = re.sub(r'\[([^\]]+)\]\(CHANGELOG\.md\)',
                        lambda m: f'[{m.group(1)}](https://github.com/xcutiboo/MythicRod/blob/master/CHANGELOG.md)', body)
          payload = json.dumps({
              "body": body,
              "source_url": "https://github.com/xcutiboo/MythicRod",
              "issues_url": "https://github.com/xcutiboo/MythicRod/issues",
              "wiki_url": "https://xcutiboo.github.io/MythicRod/",
              "discord_url": "https://discord.gg/MDwtUgxX9U",
              "donation_urls": [
                  {"id": "ko-fi", "platform": "Ko-fi", "url": "https://ko-fi.com/xcutiboo"}
              ],
          }).encode()
          req = urllib.request.Request(
              "https://api.modrinth.com/v2/project/mythicrod",
              data=payload, method="PATCH",
              headers={
                  "Authorization": os.environ["MODRINTH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "xcutiboo/MythicRod (CI body sync)",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Modrinth body sync HTTP {resp.status}")
          except urllib.error.HTTPError as exc:
              print(f"Modrinth body sync failed: HTTP {exc.code}", exc.read().decode("utf-8", "replace"))
              sys.exit(0)
          PY

      - name: Skip without Modrinth token
        if: env.MODRINTH_TOKEN == ''
        run: echo "MODRINTH_TOKEN is not configured; skipping Modrinth publish."
