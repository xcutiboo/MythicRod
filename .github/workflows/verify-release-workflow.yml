name: Verify Release Workflow

on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'build.gradle'
      - 'gradle.properties'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build.yml'
      - 'build.gradle'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  verify-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify workflow file syntax
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            try {
              const workflowContent = fs.readFileSync('.github/workflows/build.yml', 'utf8');
              const workflow = yaml.load(workflowContent);

              console.log('✓ Workflow YAML is valid');
              console.log('✓ Jobs defined:', Object.keys(workflow.jobs).join(', '));

              // Verify critical components
              if (!workflow.jobs.build) {
                core.setFailed('Build job is missing');
              }
              if (!workflow.jobs.release) {
                core.setFailed('Release job is missing');
              }
              if (!workflow.on.tags || !workflow.on.tags.includes('v*')) {
                core.setFailed('Tag trigger for releases is not configured');
              }

              console.log('✓ All critical workflow components are present');
            } catch (error) {
              core.setFailed(`Workflow validation failed: ${error.message}`);
            }
