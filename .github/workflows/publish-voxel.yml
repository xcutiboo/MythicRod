name: Publish to Voxel

on:
  # Publish only on a real GitHub release. Bare tag pushes do not fire this.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VOXEL_API_TOKEN: ${{ secrets.VOXEL_API_TOKEN }}
      VOXEL_RESOURCE_ID: ${{ vars.VOXEL_RESOURCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Skip when not configured
        if: env.VOXEL_API_TOKEN == '' || env.VOXEL_RESOURCE_ID == ''
        run: |
          echo "VOXEL_API_TOKEN secret or VOXEL_RESOURCE_ID variable is not set; skipping Voxel publish."
          exit 0

      - name: Build shadow jar
        if: env.VOXEL_API_TOKEN != '' && env.VOXEL_RESOURCE_ID != ''
        run: ./gradlew :mythicrod-paper:shadowJar --stacktrace --no-daemon

      - name: Resolve release metadata
        if: env.VOXEL_API_TOKEN != '' && env.VOXEL_RESOURCE_ID != ''
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if [[ -z "$version" || "$version" == "$REF_NAME" ]]; then
            version=$(./gradlew -q :mythicrod-paper:properties | awk -F': *' '/^version:/{print $2; exit}')
          fi
          jar=$(ls mythicrod-paper/build/libs/MythicRod-Paper-*.jar | grep -v -- '-dev' | head -1)
          beta=0
          snapshot=0
          case "$version" in
            *-rc*|*-beta*|*-alpha*) beta=1 ;;
            *-snapshot*|*-SNAPSHOT*) snapshot=1 ;;
          esac
          {
            echo "version=$version"
            echo "jar=$jar"
            echo "beta=$beta"
            echo "snapshot=$snapshot"
          } >> "$GITHUB_OUTPUT"

      - name: Check Voxel for an existing version
        if: env.VOXEL_API_TOKEN != '' && env.VOXEL_RESOURCE_ID != ''
        id: dedupe
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          existing=$(curl -fsSL "https://api.voxel.shop/v1/getResourceUpdates?resource_id=${VOXEL_RESOURCE_ID}" \
            | jq -r --arg v "$VERSION" '.response.updates[]? | select(.version == $v) | .id' | head -1)
          if [[ -n "$existing" ]]; then
            echo "Voxel already has update id $existing for version $VERSION; skipping upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload version to Voxel
        if: |
          env.VOXEL_API_TOKEN != ''
          && env.VOXEL_RESOURCE_ID != ''
          && steps.dedupe.outputs.skip == 'false'
        # Soft-fail kept while the resource sits in Voxel review queue;
        # the API rejects updates to non-approved products. Once
        # approved, the doPostUpdate call goes through normally.
        continue-on-error: true
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          JAR: ${{ steps.meta.outputs.jar }}
          BETA: ${{ steps.meta.outputs.beta }}
          SNAPSHOT: ${{ steps.meta.outputs.snapshot }}
        run: |
          set -euo pipefail
          message=$(awk '/^## \['"$VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md \
            | sed '/./,$!d' | head -200)
          if [[ -z "$message" ]]; then
            message="See https://github.com/xcutiboo/MythicRod/releases/tag/v${VERSION}"
          fi
          response=$(curl -fsS -X POST "https://api.voxel.shop/v1/doPostUpdate" \
            -F "api_key=${VOXEL_API_TOKEN}" \
            -F "resource_id=${VOXEL_RESOURCE_ID}" \
            -F "version=${VERSION}" \
            -F "title=MythicRod ${VERSION}" \
            -F "message=${message}" \
            -F "beta=${BETA}" \
            -F "snapshot=${SNAPSHOT}" \
            -F "file=@${JAR}")
          echo "$response"
          status=$(echo "$response" | jq -r '.response.success // false')
          if [[ "$status" != "true" ]]; then
            echo "Voxel rejected the upload."
            echo "$response" | jq -r '.response.errors[]?' || true
            exit 1
          fi
