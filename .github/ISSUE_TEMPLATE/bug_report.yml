name: Bug report
description: Report a reproducible problem with MythicRod
labels: ["bug"]
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much of
        the form as you can — the more we know up front, the faster we can fix it.

  - type: input
    id: mythicrod-version
    attributes:
      label: MythicRod version
      description: Output of `/version MythicRod` in-game or the jar filename.
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: paper-version
    attributes:
      label: Paper version
      description: Output of `/version` on your server.
      placeholder: "Paper 26.1.2 build 64"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      description: Output of `java -version` on the server host.
      placeholder: "Temurin 25.0.3"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Paper
        - Folia
        - Other Paper fork
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of steps that reliably reproduces the issue.
      placeholder: |
        1. Catch a fish in a Plains biome with a basic rod
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant server log
      description: Paste any errors or stack traces from `logs/latest.log`. A
        gist or paste link is fine for long logs.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant config snippets
      description: Sections of `config.yml` or `drops.yml` related to the issue.
      render: yaml
